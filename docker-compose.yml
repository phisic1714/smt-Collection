version: '3'

services:
  frontend:
    build: ./frontend
    container_name: angular-app

  backend:
    build: ./backend
    container_name: fastapi-app

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
