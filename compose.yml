name: smt-collection
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - retronet
    develop:
      watch:
        - action: sync+restart
          path: /frontend
          target: ./frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - retronet
networks:
  retronet:
